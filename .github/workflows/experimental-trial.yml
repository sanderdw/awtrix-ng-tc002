name: Versioned trial release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Pull requests from this repository also publish a test pre-release (see publish-pull-request).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trial-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A pull request is built from its head commit, not GitHub's merge commit, so a test build
      # names a commit that exists on the branch.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.14'
          python-version: '3.12'
          enable-cache: true
      - name: Check release tag matches the firmware version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*AWTRIX_NG_VERSION="\([^"]*\)".*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match firmware version v$version."
            exit 1
          fi
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev perl curl xz-utils
      - name: Apply the TC002 patch series to pristine upstream
        run: |
          uv sync --locked
          uv run tools/upstream.py apply
          uv run tools/upstream.py status
          cp -r patches "$RUNNER_TEMP/patches-before"
          uv run tools/upstream.py export
          diff -r "$RUNNER_TEMP/patches-before" patches
      - name: Build and test on the host
        run: |
          uv run cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          uv run cmake --build build-host -j4
          uv run ctest --test-dir build-host --output-on-failure
          uv run pytest -q
      - name: Cache pinned ARM toolchain and OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-deps
          key: tc002-arm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build.sh', 'tools/build_tls.sh', 'cmake/tc002-arm.cmake') }}
      - name: Build the ARM application
        run: bash tools/build.sh
      - name: Package and verify the public trial and installer bundles
        run: |
          uv run tools/package_trial.py
          uv run tools/check_trial_package.py dist/public/awtrix-ng-tc002-trial.zip --commit "$SOURCE_SHA"
          uv run tools/package_installer.py
          uv run tools/check_trial_package.py dist/public/awtrix-ng-tc002-installer.zip --commit "$SOURCE_SHA"
          cp install.sh dist/public/install.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-trial
          path: |
            dist/public/awtrix-ng-tc002-trial.zip
            dist/public/awtrix-ng-tc002-trial.zip.sha256
            dist/public/awtrix-ng-tc002-installer.zip
            dist/public/awtrix-ng-tc002-installer.zip.sha256
            dist/public/install.sh
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: experimental-trial
          path: dist/public
      - name: Publish a separate prerelease for this version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist/public && sha256sum -c awtrix-ng-tc002-trial.zip.sha256 && sha256sum -c awtrix-ng-tc002-installer.zip.sha256)
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; its tag and downloads are preserved."
            exit 0
          fi
          notes="$RUNNER_TEMP/trial-release.md"
          # docs/releases/<tag>.md, when present, replaces the @CHANGES@ line; otherwise it is dropped.
          sed -e "/@CHANGES@/{r docs/releases/$tag.md" -e 'd' -e '}' -e "s/@TAG@/$tag/g" docs/TRIAL-RELEASE.md > "$notes"
          printf '\n## Build\n\nSource: [%s](https://github.com/%s/commit/%s)\n\n[Build and checks](https://github.com/%s/actions/runs/%s)\n' \
            "$GITHUB_SHA" "$GH_REPO" "$GITHUB_SHA" "$GH_REPO" "$GITHUB_RUN_ID" >> "$notes"
          gh release create "$tag" \
            dist/public/awtrix-ng-tc002-trial.zip \
            dist/public/awtrix-ng-tc002-trial.zip.sha256 \
            dist/public/awtrix-ng-tc002-installer.zip \
            dist/public/awtrix-ng-tc002-installer.zip.sha256 \
            dist/public/install.sh \
            --verify-tag --prerelease --latest=false \
            --title "AWTRIX NG TC002 $tag (experimental RAM trial)" --notes-file "$notes"

  # One test pre-release per pull request, tagged v<version>-pr<number> so that
  #   install.sh --version v<version>-pr<number> CLOCK_IP
  # installs it. Every push replaces it, and closing the pull request deletes it. Only for pull
  # requests from this repository: a fork's token cannot create releases.
  publish-pull-request:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: experimental-trial
          path: dist/public
      - name: Replace the pull request's test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          (cd dist/public && sha256sum -c awtrix-ng-tc002-trial.zip.sha256 && sha256sum -c awtrix-ng-tc002-installer.zip.sha256)
          version=$(sed -n 's/.*AWTRIX_NG_VERSION="\([^"]*\)".*/\1/p' CMakeLists.txt)
          tag="v$version-pr$PR"
          # Remove this pull request's previous test build, whatever version it carried. Only
          # pre-releases ending in -pr<number> are touched; version tags never end that way.
          gh release list --limit 200 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            { grep -E -- "-pr$PR\$" || true; } |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
          notes="$RUNNER_TEMP/pull-request-release.md"
          {
            printf '> **Test build of pull request [#%s](https://github.com/%s/pull/%s)**, commit %s. It is\n' \
              "$PR" "$GH_REPO" "$PR" "${SOURCE_SHA:0:12}"
            printf '> replaced on every push to the pull request and deleted when it closes; the clock reports\n'
            printf '> version %s.\n\n' "$version"
            # The notes of the version this pull request prepares, when it has them.
            sed -e "/@CHANGES@/{r docs/releases/v$version.md" -e 'd' -e '}' -e "s/@TAG@/$tag/g" docs/TRIAL-RELEASE.md
            printf '\n## Build\n\nSource: [%s](https://github.com/%s/commit/%s)\n\n[Build and checks](https://github.com/%s/actions/runs/%s)\n' \
              "$SOURCE_SHA" "$GH_REPO" "$SOURCE_SHA" "$GH_REPO" "$GITHUB_RUN_ID"
          } > "$notes"
          gh release create "$tag" \
            dist/public/awtrix-ng-tc002-trial.zip \
            dist/public/awtrix-ng-tc002-trial.zip.sha256 \
            dist/public/awtrix-ng-tc002-installer.zip \
            dist/public/awtrix-ng-tc002-installer.zip.sha256 \
            dist/public/install.sh \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "AWTRIX NG TC002 $tag (test build of pull request #$PR)" --notes-file "$notes"
          {
            echo "Test pre-release [$tag](https://github.com/$GH_REPO/releases/tag/$tag). Install it with:"
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/$GH_REPO/main/install.sh | sh -s -- --version $tag CLOCK_IP"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  remove-pull-request-release:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete the pull request's test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            { grep -E -- "-pr$PR\$" || true; } |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
